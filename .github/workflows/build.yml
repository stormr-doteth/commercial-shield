name: Build APK

# Builds the APK from source on GitHub's servers for every push and pull request,
# so anyone can check that a released APK matches the public code.
# Pushing a tag like v1.0.0 also creates a GitHub Release with the APK and its
# SHA-256 checksum, signed with the release key stored in repository secrets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-31" "build-tools;34.0.0" > /dev/null

      - name: Decode release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Missing KEYSTORE_B64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./build.sh

      - name: Checksum
        run: |
          cd build
          sha256sum commercial-shield.apk > commercial-shield.apk.sha256
          cat commercial-shield.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: commercial-shield
          path: |
            build/commercial-shield.apk
            build/commercial-shield.apk.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/commercial-shield.apk
            build/commercial-shield.apk.sha256
          generate_release_notes: true
