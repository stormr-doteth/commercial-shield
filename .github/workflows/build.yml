name: Build APK

# Builds the APK from source on GitHub's servers for every push and pull request,
# so anyone can check that a released APK matches the public code.
# Pushing a tag like v1.0.0 also creates a GitHub Release with the APK and its
# SHA-256 checksum, signed with the release key stored in repository secrets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-31" "build-tools;34.0.0" > /dev/null

      - name: Decode release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Missing KEYSTORE_B64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # The release key is only unlocked for version tags; every other build
      # (pushes, pull requests) is signed with a throwaway debug key.
      - name: Build
        env:
          KEYSTORE_PASS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.KEYSTORE_PASS || '' }}
          KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.KEY_ALIAS || '' }}
          KEY_PASS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.KEY_PASS || '' }}
        run: ./build.sh

      - name: Checksum
        run: |
          cd build
          sha256sum not-in-front-of-the-kids.apk > not-in-front-of-the-kids.apk.sha256
          cat not-in-front-of-the-kids.apk.sha256
          cp not-in-front-of-the-kids.apk commercial-shield.apk

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          SHA=$(cut -d' ' -f1 build/not-in-front-of-the-kids.apk.sha256)
          CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/not-in-front-of-the-kids.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          {
            echo "## Install"
            echo "Download **not-in-front-of-the-kids.apk** below, or see the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for step-by-step TV instructions."
            echo
            echo "## Verify your download"
            echo "- APK SHA-256: \`$SHA\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo
            echo "Built by GitHub Actions from commit ${GITHUB_SHA} ([build log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
          } > build/notes.md
          cat build/notes.md

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: not-in-front-of-the-kids
          path: |
            build/not-in-front-of-the-kids.apk
            build/not-in-front-of-the-kids.apk.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # commercial-shield.apk is the same file under the project's original
          # name, kept so existing download links and Downloader codes still work.
          files: |
            build/not-in-front-of-the-kids.apk
            build/not-in-front-of-the-kids.apk.sha256
            build/commercial-shield.apk
          body_path: build/notes.md
